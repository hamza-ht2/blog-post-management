<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="max-w-6xl mx-auto px-6 py-12">

        <!-- Header -->
        <div class="mb-10">
            <h1 class="font-serif text-3xl font-bold text-gray-900">
                Welcome back, <span class="accent" th:text="${user.firstName}"></span>
            </h1>
            <p class="mt-1 text-sm text-gray-500">Here's an overview of your activity.</p>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-12">

            <div class="bg-gray-50 border border-gray-200 rounded-xl p-5">
                <p class="text-xs font-medium text-gray-500 uppercase tracking-widest mb-1">Total Posts</p>
                <p class="font-serif text-3xl font-bold text-gray-900" th:text="${totalPosts}">0</p>
            </div>

            <div class="bg-gray-50 border border-gray-200 rounded-xl p-5">
                <p class="text-xs font-medium text-gray-500 uppercase tracking-widest mb-1">Published</p>
                <p class="font-serif text-3xl font-bold text-gray-900" th:text="${totalPublished}">0</p>
            </div>

            <div class="bg-gray-50 border border-gray-200 rounded-xl p-5">
                <p class="text-xs font-medium text-gray-500 uppercase tracking-widest mb-1">Drafts</p>
                <p class="font-serif text-3xl font-bold text-gray-900" th:text="${totalDrafts}">0</p>
            </div>

            <div class="bg-orange-50 border border-orange-200 rounded-xl p-5">
                <p class="text-xs font-medium text-gray-500 uppercase tracking-widest mb-1">Total Views</p>
                <p class="font-serif text-3xl font-bold accent" th:text="${totalViews}">0</p>
            </div>

            <div class="bg-gray-50 border border-gray-200 rounded-xl p-5">
                <p class="text-xs font-medium text-gray-500 uppercase tracking-widest mb-1">Followers</p>
                <p class="font-serif text-3xl font-bold text-gray-900" th:text="${totalFollowers}">0</p>
            </div>

        </div>

        <!-- Quick Actions -->
        <div class="flex items-center gap-4 mb-12">
            <a th:href="@{/posts/create}"
               class="bg-accent text-white px-5 py-2 rounded-full text-sm font-semibold hover:opacity-90 transition-opacity">
                Write new post
            </a>
            <a th:href="@{/profile/posts}"
               class="border border-gray-200 text-gray-600 px-5 py-2 rounded-full text-sm font-medium hover:border-orange-400 hover-accent transition-colors">
                My posts
            </a>
            <a th:href="@{/profile/drafts}"
               class="border border-gray-200 text-gray-600 px-5 py-2 rounded-full text-sm font-medium hover:border-orange-400 hover-accent transition-colors">
                My drafts
            </a>
            <a th:href="@{/profile/settings}"
               class="border border-gray-200 text-gray-600 px-5 py-2 rounded-full text-sm font-medium hover:border-orange-400 hover-accent transition-colors">
                Settings
            </a>
        </div>

    </div>

</div>
</body>
</html>
