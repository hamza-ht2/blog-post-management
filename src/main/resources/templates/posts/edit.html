<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="max-w-3xl mx-auto px-6 py-12">

        <!-- Header -->
        <div class="mb-8">
            <h1 class="font-serif text-3xl font-bold text-gray-900">Edit post</h1>
            <p class="mt-1 text-sm text-gray-500">Make changes to your post.</p>
        </div>

        <!-- Error -->
        <div th:if="${error}"
             class="mb-6 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"
             th:text="${error}">
        </div>

        <form th:action="@{/posts/{id}/edit(id=${post.id})}" th:object="${post}" method="post" class="space-y-6">

            <!-- Title -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                <input type="text"
                       th:field="*{title}"
                       class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                <p th:if="${#fields.hasErrors('title')}"
                   th:errors="*{title}"
                   class="mt-1 text-xs text-red-500"></p>
            </div>

            <!-- Excerpt -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Excerpt</label>
                <textarea th:field="*{excerpt}"
                          rows="2"
                          class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50 resize-none">
                </textarea>
            </div>

            <!-- Content -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Content</label>
                <textarea th:field="*{content}"
                          rows="16"
                          class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50 resize-none">
                </textarea>
                <p th:if="${#fields.hasErrors('content')}"
                   th:errors="*{content}"
                   class="mt-1 text-xs text-red-500"></p>
            </div>

            <!-- Cover Image -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cover Image URL</label>
                <input type="text"
                       th:field="*{coverImage}"
                       class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
            </div>

            <!-- Category -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                <select th:field="*{category.id}"
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50">
                    <option value="">Select a category</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}">
                    </option>
                </select>
            </div>

            <!-- Tags -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-3">Tags</label>
                <div class="flex flex-wrap gap-2 mb-3">
                    <span th:each="tag : ${post.tags}"
                          class="flex items-center gap-2 text-xs font-medium text-gray-600 bg-gray-100 px-3 py-1 rounded-full">
                        <span th:text="'#' + ${tag.name}"></span>
                        <form th:action="@{/posts/{postId}/tags/{tagId}/remove(postId=${post.id}, tagId=${tag.id})}" method="post" class="inline">
                            <button type="submit" class="text-gray-400 hover:text-red-500 transition-colors">×</button>
                        </form>
                    </span>
                </div>
                <div class="flex gap-2">
                    <select id="tagSelect"
                            class="flex-1 px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50">
                        <option value="">Add a tag...</option>
                        <option th:each="tag : ${tags}"
                                th:value="${tag.id}"
                                th:text="${tag.name}">
                        </option>
                    </select>
                    <button type="button"
                            onclick="addTag()"
                            class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">
                        Add
                    </button>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-between pt-4 border-t border-gray-200">
                <div class="flex items-center gap-4">
                    <a th:href="@{/posts/{slug}(slug=${post.slug})}"
                       class="text-sm text-gray-500 hover-accent transition-colors">
                        Cancel
                    </a>
                    <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post"
                          onsubmit="return confirm('Are you sure you want to delete this post?')">
                        <button type="submit" class="text-sm text-red-400 hover:text-red-600 transition-colors">
                            Delete post
                        </button>
                    </form>
                </div>
                <div class="flex items-center gap-3">
                    <form th:action="@{/posts/{id}/publish(id=${post.id})}" method="post" class="inline"
                          th:if="${post.postStatus.name() == 'DRAFT'}">
                        <button type="submit"
                                class="border border-accent accent px-5 py-2 rounded-lg text-sm font-semibold hover:bg-orange-50 transition-colors">
                            Publish
                        </button>
                    </form>
                    <form th:action="@{/posts/{id}/unpublish(id=${post.id})}" method="post" class="inline"
                          th:if="${post.postStatus.name() == 'PUBLISHED'}">
                        <button type="submit"
                                class="border border-gray-300 text-gray-600 px-5 py-2 rounded-lg text-sm font-semibold hover:border-orange-400 hover-accent transition-colors">
                            Unpublish
                        </button>
                    </form>
                    <button type="submit"
                            class="bg-accent text-white px-6 py-2 rounded-lg text-sm font-semibold hover:opacity-90 transition-opacity">
                        Save changes
                    </button>
                </div>
            </div>

        </form>
    </div>

    <!-- Hidden post id for JS -->
    <div id="postData" th:data-post-id="${post.id}" style="display:none"></div>

    <script>
        function addTag() {
            const select = document.getElementById('tagSelect');
            const tagId = select.value;
            const postId = document.getElementById('postData').getAttribute('data-post-id');
            if (tagId) {
                window.location.href = '/posts/' + postId + '/tags/' + tagId + '/add';
            }
        }
    </script>

</div>
</body>
</html>
