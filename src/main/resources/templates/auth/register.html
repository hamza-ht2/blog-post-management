<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="min-h-screen flex items-center justify-center px-6 py-16">
        <div class="w-full max-w-md">

            <!-- Header -->
            <div class="text-center mb-10">
                <a th:href="@{/home}" class="font-serif text-3xl font-bold tracking-tight">
                    Blog<span class="accent">.</span>
                </a>
                <h1 class="mt-6 text-2xl font-serif font-bold text-gray-900">Create your account</h1>
                <p class="mt-2 text-sm text-gray-500">Start writing and sharing your ideas</p>
            </div>

            <!-- Error message -->
            <div th:if="${error}"
                 class="mb-6 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"
                 th:text="${error}">
            </div>

            <!-- Form -->
            <form th:action="@{/auth/register}" th:object="${user}" method="post" class="space-y-5">

                <div class="flex gap-4">
                    <div class="flex-1">
                        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">First name</label>
                        <input type="text"
                               id="firstName"
                               th:field="*{firstName}"
                               placeholder="John"
                               class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                        <p th:if="${#fields.hasErrors('firstName')}"
                           th:errors="*{firstName}"
                           class="mt-1 text-xs text-red-500"></p>
                    </div>
                    <div class="flex-1">
                        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Last name</label>
                        <input type="text"
                               id="lastName"
                               th:field="*{lastName}"
                               placeholder="Doe"
                               class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                        <p th:if="${#fields.hasErrors('lastName')}"
                           th:errors="*{lastName}"
                           class="mt-1 text-xs text-red-500"></p>
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           placeholder="john@example.com"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                    <p th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"
                       class="mt-1 text-xs text-red-500"></p>
                </div>

                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text"
                           id="username"
                           th:field="*{username}"
                           placeholder="johndoe"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                    <p th:if="${#fields.hasErrors('username')}"
                       th:errors="*{username}"
                       class="mt-1 text-xs text-red-500"></p>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           placeholder="••••••••"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                    <p th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}"
                       class="mt-1 text-xs text-red-500"></p>
                </div>

                <button type="submit"
                        class="w-full bg-accent text-white py-3 rounded-lg text-sm font-semibold hover:opacity-90 transition-opacity">
                    Create account
                </button>

            </form>

            <!-- Login link -->
            <p class="mt-8 text-center text-sm text-gray-500">
                Already have an account?
                <a th:href="@{/auth/login}" class="accent font-medium hover:underline">Sign in</a>
            </p>

        </div>
    </div>

</div>
</body>
</html>
