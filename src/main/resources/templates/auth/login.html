<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="min-h-screen flex items-center justify-center px-6 py-16">
        <div class="w-full max-w-md">

            <!-- Header -->
            <div class="text-center mb-10">
                <a th:href="@{/home}" class="font-serif text-3xl font-bold tracking-tight">
                    Blog<span class="accent">.</span>
                </a>
                <h1 class="mt-6 text-2xl font-serif font-bold text-gray-900">Welcome back</h1>
                <p class="mt-2 text-sm text-gray-500">Sign in to your account to continue</p>
            </div>

            <!-- Success message -->
            <div th:if="${param.registered}"
                 class="mb-6 px-4 py-3 bg-green-50 border border-green-200 rounded-lg text-sm text-green-700">
                Account created successfully. Please sign in.
            </div>

            <!-- Error message -->
            <div th:if="${param.error}"
                 class="mb-6 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
                Invalid username or password. Please try again.
            </div>

            <!-- Form -->
            <form th:action="@{/auth/login}" method="post" class="space-y-5">

                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text"
                           id="username"
                           name="username"
                           placeholder="your username"
                           required
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="••••••••"
                           required
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                </div>

                <button type="submit"
                        class="w-full bg-accent text-white py-3 rounded-lg text-sm font-semibold hover:opacity-90 transition-opacity">
                    Sign in
                </button>

            </form>

            <!-- Register link -->
            <p class="mt-8 text-center text-sm text-gray-500">
                Don't have an account?
                <a th:href="@{/auth/register}" class="accent font-medium hover:underline">Get started</a>
            </p>

        </div>
    </div>

</div>
</body>
</html>
