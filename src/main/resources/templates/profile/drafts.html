<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="max-w-4xl mx-auto px-6 py-12">

        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="font-serif text-3xl font-bold text-gray-900">My Drafts</h1>
                <p class="mt-1 text-sm text-gray-500">Posts you are still working on.</p>
            </div>
            <a th:href="@{/posts/create}"
               class="bg-accent text-white px-5 py-2 rounded-full text-sm font-semibold hover:opacity-90 transition-opacity">
                Write new post
            </a>
        </div>

        <!-- Tabs -->
        <div class="flex items-center gap-6 border-b border-gray-200 mb-8">
            <a th:href="@{/profile/posts}"
               class="text-sm font-medium pb-3 border-b-2 border-transparent text-gray-500 hover-accent transition-colors">
                All
            </a>
            <a th:href="@{/profile/drafts}"
               class="text-sm font-medium pb-3 border-b-2 border-orange-400 accent">
                Drafts
            </a>
            <a th:href="@{/profile/rejected}"
               class="text-sm font-medium pb-3 border-b-2 border-transparent text-gray-500 hover-accent transition-colors">
                Rejected
            </a>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(drafts)}" class="text-center py-20">
            <p class="text-gray-400 text-lg">No drafts yet.</p>
        </div>

        <!-- Drafts -->
        <div th:unless="${#lists.isEmpty(drafts)}" class="divide-y divide-gray-100">
            <article th:each="post : ${drafts}" class="py-6 flex gap-6 items-start">
                <div class="flex-1 min-w-0">
                    <a th:href="@{/posts/{slug}(slug=${post.slug})}">
                        <h3 class="font-serif text-lg font-bold text-gray-900 hover-accent transition-colors mb-1"
                            th:text="${post.title}">
                        </h3>
                    </a>
                    <p class="text-sm text-gray-500 line-clamp-2" th:text="${post.excerpt}"></p>
                    <div class="flex items-center gap-4 mt-3">
                        <span class="text-xs text-gray-400"
                              th:text="${#temporals.format(post.createdAt, 'MMM dd, yyyy')}">
                        </span>
                        <span class="text-xs text-gray-400"
                              th:text="${post.readingTime + ' min read'}">
                        </span>
                    </div>
                </div>
                <div class="shrink-0 flex items-center gap-2">
                    <form th:action="@{/posts/{id}/publish(id=${post.id})}" method="post">
                        <button type="submit"
                                class="text-xs font-medium border border-orange-300 accent px-3 py-1.5 rounded-lg hover:bg-orange-50 transition-colors">
                            Publish
                        </button>
                    </form>
                    <a th:href="@{/posts/{id}/edit(id=${post.id})}"
                       class="text-xs font-medium border border-gray-200 text-gray-600 px-3 py-1.5 rounded-lg hover:border-orange-400 hover-accent transition-colors">
                        Edit
                    </a>
                </div>
            </article>
        </div>

    </div>

</div>
</body>
</html>
