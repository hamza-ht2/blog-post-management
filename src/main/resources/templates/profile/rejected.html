<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="max-w-4xl mx-auto px-6 py-12">

        <div class="mb-8">
            <h1 class="font-serif text-3xl font-bold text-gray-900">Rejected Posts</h1>
            <p class="mt-1 text-sm text-gray-500">Posts that were rejected by the admin.</p>
        </div>

        <!-- Tabs -->
        <div class="flex items-center gap-6 border-b border-gray-200 mb-8">
            <a th:href="@{/profile/posts}"
               class="text-sm font-medium pb-3 border-b-2 border-transparent text-gray-500 hover-accent transition-colors">
                All
            </a>
            <a th:href="@{/profile/drafts}"
               class="text-sm font-medium pb-3 border-b-2 border-transparent text-gray-500 hover-accent transition-colors">
                Drafts
            </a>
            <a th:href="@{/profile/rejected}"
               class="text-sm font-medium pb-3 border-b-2 border-orange-400 accent">
                Rejected
            </a>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(rejected)}" class="text-center py-20">
            <p class="text-gray-400 text-lg">No rejected posts.</p>
        </div>

        <!-- Rejected Posts -->
        <div th:unless="${#lists.isEmpty(rejected)}" class="divide-y divide-gray-100">
            <article th:each="post : ${rejected}" class="py-6 flex gap-6 items-start">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-xs font-medium text-red-500 bg-red-50 px-2 py-0.5 rounded-full">
                            Rejected
                        </span>
                    </div>
                    <h3 class="font-serif text-lg font-bold text-gray-900 mb-1"
                        th:text="${post.title}">
                    </h3>
                    <p class="text-sm text-gray-500 line-clamp-2" th:text="${post.excerpt}"></p>
                    <div class="flex items-center gap-4 mt-3">
                        <span class="text-xs text-gray-400"
                              th:text="${#temporals.format(post.createdAt, 'MMM dd, yyyy')}">
                        </span>
                    </div>
                </div>
                <div class="shrink-0 flex items-center gap-2">
                    <a th:href="@{/posts/{id}/edit(id=${post.id})}"
                       class="text-xs font-medium border border-gray-200 text-gray-600 px-3 py-1.5 rounded-lg hover:border-orange-400 hover-accent transition-colors">
                        Edit
                    </a>
                    <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post"
                          onsubmit="return confirm('Delete this post?')">
                        <button type="submit"
                                class="text-xs font-medium border border-gray-200 text-red-400 px-3 py-1.5 rounded-lg hover:border-red-300 transition-colors">
                            Delete
                        </button>
                    </form>
                </div>
            </article>
        </div>

    </div>

</div>
</body>
</html>
