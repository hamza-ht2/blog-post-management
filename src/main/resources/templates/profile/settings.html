<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="max-w-2xl mx-auto px-6 py-12">

        <div class="mb-8">
            <h1 class="font-serif text-3xl font-bold text-gray-900">Settings</h1>
            <p class="mt-1 text-sm text-gray-500">Manage your profile and account.</p>
        </div>

        <!-- Success messages -->
        <div th:if="${param.success}"
             class="mb-6 px-4 py-3 bg-green-50 border border-green-200 rounded-lg text-sm text-green-700">
            Profile updated successfully.
        </div>
        <div th:if="${param.passwordChanged}"
             class="mb-6 px-4 py-3 bg-green-50 border border-green-200 rounded-lg text-sm text-green-700">
            Password changed successfully.
        </div>
        <div th:if="${param.profileChanged}"
             class="mb-6 px-4 py-3 bg-green-50 border border-green-200 rounded-lg text-sm text-green-700">
            Profile photo updated successfully.
        </div>

        <!-- Error -->
        <div th:if="${error}"
             class="mb-6 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"
             th:text="${error}">
        </div>

        <!-- Profile Form -->
        <div class="bg-white border border-gray-200 rounded-xl p-6 mb-6">
            <h2 class="font-semibold text-gray-900 mb-5">Profile Information</h2>
            <form th:action="@{/profile/settings}" th:object="${user}" method="post" class="space-y-4">
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">First name</label>
                        <input type="text"
                               th:field="*{firstName}"
                               class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Last name</label>
                        <input type="text"
                               th:field="*{lastName}"
                               class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text"
                           th:field="*{username}"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Bio</label>
                    <textarea th:field="*{bio}"
                              rows="3"
                              placeholder="Tell us about yourself..."
                              class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50 resize-none">
                    </textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Website URL</label>
                    <input type="text"
                           th:field="*{websiteUrl}"
                           placeholder="https://yourwebsite.com"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Country</label>
                    <input type="text"
                           th:field="*{country}"
                           placeholder="Morocco"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                </div>
                <div class="flex justify-end pt-2">
                    <button type="submit"
                            class="bg-accent text-white px-6 py-2 rounded-lg text-sm font-semibold hover:opacity-90 transition-opacity">
                        Save changes
                    </button>
                </div>
            </form>
        </div>

        <!-- Photo Form -->
        <div class="bg-white border border-gray-200 rounded-xl p-6 mb-6">
            <h2 class="font-semibold text-gray-900 mb-5">Profile Photo</h2>
            <form th:action="@{/profile/coverImage}" method="post" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Photo URL</label>
                    <input type="text"
                           name="profileImage"
                           th:value="${user.photoProfile}"
                           placeholder="https://example.com/photo.jpg"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                </div>
                <div class="flex justify-end">
                    <button type="submit"
                            class="bg-accent text-white px-6 py-2 rounded-lg text-sm font-semibold hover:opacity-90 transition-opacity">
                        Update photo
                    </button>
                </div>
            </form>
        </div>

        <!-- Password Form -->
        <div class="bg-white border border-gray-200 rounded-xl p-6">
            <h2 class="font-semibold text-gray-900 mb-5">Change Password</h2>
            <form th:action="@{/profile/password}" method="post" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Current password</label>
                    <input type="password"
                           name="oldPassword"
                           placeholder="••••••••"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">New password</label>
                    <input type="password"
                           name="newPassword"
                           placeholder="••••••••"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-400 transition-colors bg-gray-50"/>
                </div>
                <div class="flex justify-end">
                    <button type="submit"
                            class="bg-accent text-white px-6 py-2 rounded-lg text-sm font-semibold hover:opacity-90 transition-opacity">
                        Change password
                    </button>
                </div>
            </form>
        </div>

    </div>

</div>
</body>
</html>
